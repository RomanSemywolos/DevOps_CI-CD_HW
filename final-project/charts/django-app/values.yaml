image:
  repository: 140083317091.dkr.ecr.eu-central-1.amazonaws.com/final-project-hw-ecr
  tag: latest
  pullPolicy: Always

service:
  type: LoadBalancer
  port: 80

containerPort: 8000

config:
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "djangoapp"
  POSTGRES_PASSWORD: "pass2315wd"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
